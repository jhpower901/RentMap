<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:#f5f7fa;color:#222}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;position:relative;z-index:600}
/* 모바일에서 네비가 2~3줄로 늘어지지 않게 한 줄 가로 스크롤로. 스크롤바
   자체는 숨겨서 깔끔하게 보이게 한다 (스와이프 인식은 유지). */
@media(max-width:768px){
  nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:4px 9px;font-size:12px}
  nav .brand{font-size:14px;margin-right:4px;padding:4px 6px}
}
nav .brand{font-weight:700;font-size:16px;margin-right:8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px}
nav .brand:hover{background:#f0f0f0}
nav .brand-logo{width:20px;height:20px;display:inline-block;vertical-align:middle}
nav a{padding:5px 12px;border-radius:20px;font-size:13px;white-space:nowrap}
nav a:hover{background:#f0f0f0}
nav a.active-nav{background:#222;color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;vertical-align:middle}
.badge-dabang{background:#326CF9}
.badge-daangn{background:#FF6F00}
.badge-zigbang{background:#EF4444}
.badge-naver{background:#03C75A}
.badge-peterpan{background:#7C3AED}
#map{position:absolute;top:0;left:0;right:0;bottom:0}
.map-wrap{position:relative;height:calc(100vh - 48px)}
.panel{position:absolute;top:12px;left:12px;z-index:1000;background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 12px #0003;min-width:224px;max-height:calc(100vh - 80px);overflow-y:auto}
.panel h2{font-size:15px;font-weight:700;margin-bottom:10px}
.panel label{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:13px;cursor:pointer}
.panel input[type=checkbox]{width:15px;height:15px;accent-color:#333;cursor:pointer}
.section{margin-top:10px;padding-top:10px;border-top:1px solid #eee}
.section-title{font-size:12px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.filter-field{margin-bottom:7px}
.filter-field label{font-size:13px;display:block;margin-bottom:3px}
.filter-field input{width:100%;padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.stats{font-size:12px;color:#666}
.stat-row{display:flex;justify-content:space-between;padding:2px 0}
.total-count{font-weight:700;font-size:14px}
.source-links{display:flex;flex-direction:column;gap:4px}
.source-links a{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 6px;border-radius:7px;transition:background .15s}
.source-links a:hover{background:#f5f5f5}
.load-status{font-size:12px;color:#888;margin-top:6px;text-align:center}
.leaflet-popup-content{font-size:13px;line-height:1.7;min-width:200px;max-width:250px}
.popup-title{font-weight:700;margin-bottom:4px;font-size:14px}
.popup-price{color:#c00;font-weight:700;font-size:14px}
.popup-img{width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin:4px 0}
.popup-meta{color:#555;font-size:12px}
.link-btn{display:inline-block;padding:3px 10px;border:1px solid #ccc;border-radius:5px;font-size:12px;white-space:nowrap}
.link-btn:hover{background:#eee}
.heart-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;vertical-align:middle}
/* Like + dislike popup buttons. Like swaps between 🤍 and ❤️ so the state is
   already obvious; dislike has only 👎, so we de-saturate the off state via
   grayscale and add a pill background when on. Mirrors platform-common.css. */
.reaction-btn{cursor:pointer;transition:filter .12s,background .15s,transform .12s;padding:2px 6px;border-radius:6px;line-height:1}
.reaction-btn:hover{transform:scale(1.12)}
.fav-dis-pop:not(.on){filter:grayscale(1) brightness(.85)}
.fav-dis-pop.on{filter:none;background:#e5e7eb}
.fav-like-pop.on{background:#fee2e2}
.bm-pop:not(.on){filter:grayscale(1) brightness(.85)}
.bm-pop.on{filter:none;background:#e0e7ff}
.area-btns{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.area-btns button{flex:1;min-width:0;padding:5px 8px;border:1px solid #ccc;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.area-btns button:hover{background:#f0f0f0}
.area-btns button.active{background:#6366F1;color:#fff;border-color:#6366F1}
.area-status{font-size:12px;color:#666;margin-top:6px}
/* Map markers: invisible 44x44 hit area wraps a small visible dot so touch
   targets meet the 44px minimum without enlarging the visual marker. */
.rentmap-marker{background:transparent !important;border:0 !important;display:flex !important;align-items:center;justify-content:center;cursor:pointer}
.rentmap-marker-dot{display:block;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);transition:transform .12s,opacity .15s;pointer-events:none}
.rentmap-marker:hover .rentmap-marker-dot{transform:scale(1.18)}
/* Mobile-collapsible filter panel: the panel covers ~60% of a phone screen and
   was blocking taps on every marker beneath it. On screens ≤768px the panel
   collapses to just its toggle bar; tapping the bar expands the full panel. */
.panel-toggle{display:none;align-items:center;gap:8px;padding:8px 12px;background:transparent;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:700;width:100%;border-radius:8px;color:inherit;min-height:40px}
.panel-toggle:hover{background:#f0f0f0}
.panel-toggle-icon{font-size:16px;line-height:1;width:18px;text-align:center}
.panel-toggle-count{margin-left:auto;font-weight:700;color:#c00}
@media (max-width:768px){
  .panel{min-width:0;max-width:calc(100vw - 24px);padding:6px}
  .panel-toggle{display:flex}
  .panel.collapsed > :not(.panel-toggle){display:none !important}
  .panel.collapsed{padding:0}
  .panel.collapsed .panel-toggle{padding:10px 14px}
  .panel:not(.collapsed) .panel-toggle{margin-bottom:6px;border-bottom:1px solid #eee;border-radius:0}
}
</style>

      <a href="naver.html"><span class="badge badge-naver">네이버</span> 목록 보기</a>

<script src="region-data-loader.js?v=20260605-mtime1"></script>
<script src="listing-data-source.js?v=20260527-zigbang-img1"></script>
<script src="auth.js?v=20260525-auth1"></script>
<script src="favorites.js?v=20260602-fieldmerge"></script>
<script src="bookmarks.js?v=20260602-bm1"></script>
<script src="user-filters.js?v=20260527-filter1"></script>
<script src="area-filter.js?v=20260602-areaundo"></script>
<script src="price-parser.js?v=20260602-price1"></script>
<script>
const COLORS = { dabang: '#326CF9', daangn: '#FF6F00', zigbang: '#EF4444', naver: '#03C75A', peterpan: '#7C3AED' };
const NAMES  = { dabang: '다방', daangn: '당근', zigbang: '직방', naver: '네이버', peterpan: '피터팬' };

function fmtDeposit(v) {
  if (v === null || v === undefined) return '-';
  if (v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '억';
  return v + '만';
}
function fmtRent(v) {
  if (v === null || v === undefined) return '-';
  return v + '만';
}

// Map setup
// Default to Ajou bbox so the map is interactive even before the region
// metadata arrives (or if the fetch fails). The setView call below recentres
// once the current region's coords are known.
const map = L.map('map').setView([37.2779, 127.0438], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);
const centerMarker = L.marker([37.280062, 127.043688])
  .addTo(map)
  .bindPopup('<b>아주대학교 정문</b>')
  .openPopup();

// Marker cluster group — without this the page renders 8000+ raw markers and
// every applyFilter() iterates all of them with hasLayer/addTo/remove. With
// clustering only the markers in the current viewport's clusters land in the
// DOM, and the cluster delegates show/hide to a spatial index.
//
// maxClusterRadius is intentionally tiny (1 px) so we only merge markers
// whose screen position is effectively identical — i.e. multiple listings
// from the same building (geocode landed on the same lat/lon). Different
// buildings stay as individual dots so the exact location of each listing
// is preserved; a bigger radius (the library default is 80) would hide
// neighbouring buildings inside a single cluster.
//
// We deliberately do NOT set disableClusteringAtZoom — when several listings
// share the exact same coordinate (very common: 같은 건물의 매물 묶음) they
// would otherwise stack on top of each other at deep zooms and become
// unclickable. Keeping clustering active at every zoom means same-coord
// markers always render as a numbered circle that users can spiderfy out
// (the markercluster default behaviour for a zero-area cluster is to
// spider on click regardless of zoom). Neighbouring buildings still
// separate naturally because their pixel distance exceeds 1 px past z ~16.
// chunkedLoading splits the initial bulk addLayers across animation frames
// so the first paint isn't blocked by 8000+ marker insertions.
const clusterGroup = L.markerClusterGroup({
  chunkedLoading: true,
  chunkInterval: 50,
  chunkDelay: 50,
  maxClusterRadius: 1,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
});
clusterGroup.addTo(map);

// Recenter on the active region. Without this, switching to a region whose
// data is far away would leave the user looking at an empty Ajou viewport.
fetch('/api/regions', { credentials: 'same-origin', cache: 'no-store' })
  .then(r => r.ok ? r.json() : { regions: [] })
  .then(payload => {
    const slug = (window.RegionData && RegionData.currentSlug && RegionData.currentSlug()) || 'ajou';
    const region = (payload.regions || []).find(r => r.slug === slug);
    if (!region) return;
    map.setView([region.centerLat, region.centerLng], 15);
    centerMarker.setLatLng([region.centerLat, region.centerLng]);
    centerMarker.setPopupContent('<b>' + (region.name || region.slug).replace(/[<>&"']/g, '') + ' 중심</b>');
  })
  .catch(err => console.warn('Failed to fetch region center', err));

// ------- Area (polygon) filter — backed by shared AreaFilter -------
const areaOverlay = AreaFilter.mountMapOverlay(map, { drawing: true });

function refreshAreaStatus() {
  document.getElementById('chk_area').checked = AreaFilter.enabled;
  document.getElementById('areaStatus').textContent =
    '꼭짓점 ' + AreaFilter.points.length + '개' + (AreaFilter.isDefault() ? ' (기본 박스)' : '');
  document.getElementById('btnDraw').classList.toggle('active', areaOverlay.isDrawing());
}

document.getElementById('btnDraw').addEventListener('click', () => {
  if (areaOverlay.isDrawing()) areaOverlay.endDraw(false);
  else areaOverlay.startDraw();
  refreshAreaStatus();
});
document.getElementById('btnResetArea').addEventListener('click', () => {
  if (areaOverlay.isDrawing()) areaOverlay.endDraw(false);
  AreaFilter.reset();
});
document.getElementById('chk_area').addEventListener('change', e => {
  AreaFilter.setEnabled(e.target.checked);
});
AreaFilter.subscribe(() => { refreshAreaStatus(); applyFilter(); });
refreshAreaStatus();

// ------- User filter preferences (shared price + map source toggles) -------
const PRICE_FILTER_DEFAULTS = {
  maxDeposit: '3000',
  maxRent: '60',
};
const MAP_FILTER_DEFAULTS = {
  sources: { dabang: true, daangn: true, zigbang: true, naver: true, peterpan: true },
};
const priceFilterPrefs = window.UserFilters ? UserFilters.create('price', PRICE_FILTER_DEFAULTS) : null;
const mapFilterPrefs = window.UserFilters ? UserFilters.create('map', MAP_FILTER_DEFAULTS) : null;

function setControlValue(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  const next = value === null || value === undefined ? '' : String(value);
  if (el.value !== next) el.value = next;
}

function applySavedPriceFilterState(saved) {
  const state = saved || PRICE_FILTER_DEFAULTS;
  setControlValue('maxDeposit', state.maxDeposit);
  setControlValue('maxRent', state.maxRent);
}

function applySavedMapFilterState(saved) {
  const state = saved || MAP_FILTER_DEFAULTS;
  const sources = state.sources && typeof state.sources === 'object' ? state.sources : {};
  Object.keys(MAP_FILTER_DEFAULTS.sources).forEach(src => {
    const el = document.getElementById('chk_' + src);
    if (el) el.checked = sources[src] !== false;
  });
}

function currentPriceFilterState() {
  return {
    maxDeposit: document.getElementById('maxDeposit').value,
    maxRent: document.getElementById('maxRent').value,
  };
}

function currentMapFilterState() {
  const sources = {};
  Object.keys(MAP_FILTER_DEFAULTS.sources).forEach(src => {
    const el = document.getElementById('chk_' + src);
    sources[src] = !el || el.checked;
  });
  return { sources };
}

if (priceFilterPrefs) {
  priceFilterPrefs.subscribe(state => {
    applySavedPriceFilterState(state);
    applyFilter();
  });
}

if (mapFilterPrefs) {
  mapFilterPrefs.subscribe(state => {
    applySavedMapFilterState(state);
    applyFilter();
  });
}

const allMarkers = [];
// Set of marker objects currently in clusterGroup. applyFilter() diffs this
// against the new visible set so we only call addLayers/removeLayers for the
// markers that actually changed state, not all 8000+ on every filter tick.
const visibleMarkers = new Set();

function addMarkersForSource(src, rows) {
  const color = COLORS[src];
  const name  = NAMES[src];
  let visibleCount = 0;

  rows.forEach(r => {
    if (!r.lat || !r.lon) return;
    visibleCount++;
    // Use a divIcon with a 44x44 invisible container around a small visible
    // dot — L.circleMarker's hit area = radius, so radius 6 gave a 12px touch
    // target (well under the 44px mobile minimum). Visual size is unchanged.
    // No .addTo() — applyFilter() decides which markers land in clusterGroup
    // so the initial filter pass + ongoing toggles share the same code path.
    const m = L.marker([r.lat, r.lon], {
      icon: L.divIcon({
        className: 'rentmap-marker',
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -8],
        html: '<span class="rentmap-marker-dot" style="background:' + color + '"></span>',
      })
    });

    const agencyDisp = (src === 'daangn')
      ? (r.agency === 'DIRECT' ? '직거래' : r.agency === 'BROKER' ? '중개사' : (r.agency || ''))
      : (r.agency || '');
    const imgHtml = r.img1
      ? '<img class="popup-img" src="' + r.img1 + '" onerror="this.style.display=\'none\'">'
      : '';

    const isLike = window.Favorites && window.Favorites.isFav(r.id, src);
    const isDis  = window.Favorites && window.Favorites.isDislike(r.id, src);
    const isBm   = window.Bookmarks && window.Bookmarks.isBookmarked(r.id, src);
    m.bindPopup(
      '<div class="popup-title"><span class="badge badge-' + src + '">' + name + '</span> ' + (r.title || '') + '</div>' +
      imgHtml +
      '<div class="popup-price">보증금 ' + fmtDeposit(r.deposit) + ' / 월세 ' + fmtRent(r.rent) + '</div>' +
      '<div class="popup-meta">관리비 ' + fmtRent(r.maint) + ' | 총 <b>' + fmtRent(r.total) + '</b></div>' +
      '<div class="popup-meta">' + agencyDisp + (r.phone ? ' ' + r.phone : '') + '</div>' +
      '<div class="popup-meta">' + (r.address || r.region || '') + '</div>' +
      '<div class="popup-meta" style="font-family:monospace;color:#666">매물번호: ' + r.id + '</div>' +
      '<div style="margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
        '<a href="' + r.url + '" target="_blank" class="link-btn">매물 보기</a> ' +
        '<a href="' + src + '.html" class="link-btn">' + name + ' 목록</a> ' +
        '<button class="heart-btn reaction-btn fav-like-pop' + (isLike ? ' on' : '') + '" title="좋아요" onclick="toggleFavFromPopup(\'' + r.id + '\',\'' + src + '\',this)">' +
          (isLike ? '❤️' : '🤍') +
        '</button>' +
        '<button class="heart-btn reaction-btn fav-dis-pop' + (isDis ? ' on' : '') + '" title="싫어요" onclick="toggleDislikeFromPopup(\'' + r.id + '\',\'' + src + '\',this)">👎</button>' +
        '<button class="heart-btn reaction-btn bm-pop' + (isBm ? ' on' : '') + '" title="북마크 (실사 기록용)" onclick="toggleBookmarkFromPopup(\'' + r.id + '\',\'' + src + '\',this)">📌</button>' +
      '</div>'
    );
    allMarkers.push({ marker: m, src, data: r });
  });

  document.getElementById('cnt_' + src).textContent = visibleCount;
}

function applyFilter() {
  // PriceParser handles "2억", "2억500만", "20500", etc. Without it the old
  // parseFloat() returned NaN for any 한글 표기, silently disabling the filter.
  const readLimit = (id, fallback) => {
    const raw = document.getElementById(id).value;
    const parsed = window.PriceParser
      ? window.PriceParser.parseManwonText(raw)
      : (Number.isFinite(parseFloat(raw)) ? parseFloat(raw) : null);
    return parsed == null ? fallback : parsed;
  };
  const maxDep   = readLimit('maxDeposit', 9999);
  const maxRent  = readLimit('maxRent', 999);
  const shown    = { dabang: 0, daangn: 0, zigbang: 0, naver: 0, peterpan: 0 };

  // Build the next visible set in one pass, then diff against the previous
  // one so we only call clusterGroup.addLayers/removeLayers for markers that
  // actually changed state. Bulk add/remove is the markercluster fast path.
  const toAdd = [];
  const toRemove = [];
  allMarkers.forEach(({ marker, src, data }) => {
    const chk    = document.getElementById('chk_' + src).checked;
    const depOk  = data.deposit === null || data.deposit <= maxDep;
    const rentOk = data.rent    === null || data.rent    <= maxRent;
    const areaOk = AreaFilter.applies(data);
    const want   = chk && depOk && rentOk && areaOk;
    const have   = visibleMarkers.has(marker);
    if (want) shown[src]++;
    if (want && !have) { toAdd.push(marker); visibleMarkers.add(marker); }
    else if (!want && have) { toRemove.push(marker); visibleMarkers.delete(marker); }
  });
  if (toRemove.length) clusterGroup.removeLayers(toRemove);
  if (toAdd.length) clusterGroup.addLayers(toAdd);

  Object.keys(shown).forEach(src => {
    document.getElementById('cnt_' + src).textContent = shown[src];
  });
  document.getElementById('totalCount').textContent = Object.values(shown).reduce((a, b) => a + b, 0);
}

// Sync popup glyph + .on class for whichever buttons exist in the open popup.
// Because like/dislike share a key, toggling one can flip the other off — we
// query both anchors against the popup the user clicked in.
function refreshPopupReactionState(btn, id, src) {
  const wrap = btn && btn.parentElement;
  if (!wrap) return;
  const like = wrap.querySelector('.fav-like-pop');
  const dis  = wrap.querySelector('.fav-dis-pop');
  const isLike = window.Favorites.isFav(id, src);
  const isDis  = window.Favorites.isDislike(id, src);
  if (like) {
    like.textContent = isLike ? '❤️' : '🤍';
    like.classList.toggle('on', isLike);
  }
  if (dis) dis.classList.toggle('on', isDis);
}

function toggleFavFromPopup(id, src, btn) {
  if (!window.Favorites) return;
  const entry = allMarkers.find(x => String(x.data.id) === String(id) && x.src === src);
  if (!entry) return;
  if (window.Favorites.isFav(id, src)) {
    window.Favorites.remove(id, src);
  } else {
    window.Favorites.add(entry.data);
  }
  refreshPopupReactionState(btn, id, src);
}

function toggleDislikeFromPopup(id, src, btn) {
  if (!window.Favorites) return;
  const entry = allMarkers.find(x => String(x.data.id) === String(id) && x.src === src);
  if (!entry) return;
  if (window.Favorites.isDislike(id, src)) {
    window.Favorites.removeDislike(id, src);
  } else {
    window.Favorites.addDislike(entry.data);
  }
  refreshPopupReactionState(btn, id, src);
}

function toggleBookmarkFromPopup(id, src, btn) {
  if (!window.Bookmarks) return;
  const entry = allMarkers.find(x => String(x.data.id) === String(id) && x.src === src);
  if (!entry) return;
  const nowOn = window.Bookmarks.toggle({ ...entry.data, id, source: src });
  btn.classList.toggle('on', nowOn);
}

// Wire up filter controls
['chk_dabang', 'chk_daangn', 'chk_zigbang', 'chk_naver', 'chk_peterpan', 'maxDeposit', 'maxRent'].forEach(id => {
  const el = document.getElementById(id);
  const onChange = () => {
    if (id === 'maxDeposit' || id === 'maxRent') {
      if (priceFilterPrefs) priceFilterPrefs.set(currentPriceFilterState());
      else applyFilter();
      return;
    }
    if (mapFilterPrefs) mapFilterPrefs.set(currentMapFilterState());
    else applyFilter();
  };
  el.addEventListener('change', onChange);
  if (el.type !== 'checkbox') el.addEventListener('input', onChange);
});

// Load all platforms in parallel from CSV after favorites storage is scoped to
// the current user; popup heart state is baked into each marker's HTML.
const SOURCES = ['dabang', 'daangn', 'zigbang', 'naver', 'peterpan'];
const loadStatus = document.getElementById('loadStatus');

function loadAllSources() {
  let loadedCount = 0;
  SOURCES.forEach(src => {
    loadPlatformListings(src)
      .then(rows => {
        addMarkersForSource(src, rows);
        loadedCount++;
        if (loadedCount === SOURCES.length) {
          loadStatus.style.display = 'none';
          applyFilter();
        }
      })
      .catch(err => {
        console.error('Failed to load', src, err);
        document.getElementById('cnt_' + src).textContent = '!';
        loadedCount++;
        if (loadedCount === SOURCES.length) {
          loadStatus.style.display = 'none';
          applyFilter();
        }
      });
  });
}

// Prefetch every source's data via the region-aware loader so the existing
// loadPlatformListings (which checks window.DATA_* first) returns synchronously
// once the region's data files are loaded. Without this prefetch the old
// listing-data-source.js would fall back to its stale CSV paths.
(window.Favorites && window.Favorites.ready ? window.Favorites.ready : Promise.resolve())
  .finally(function () {
    RegionData.loadAll(['dabang', 'daangn', 'zigbang', 'naver', 'peterpan'], loadAllSources);
  });

// Mobile-collapsible filter panel. On phones (≤768px) the panel covers ~60% of
// the map and was blocking marker taps; collapse-by-default keeps the map
// usable. matchMedia 'change' re-applies the default when the user rotates so
// landscape phones don't end up stuck in the collapsed mode either.
(function setupPanelToggle(){
  const panel = document.getElementById('filterPanel');
  const btn   = document.getElementById('panelToggleBtn');
  const icon  = document.getElementById('panelToggleIcon');
  const total = document.getElementById('totalCount');
  const tc    = document.getElementById('panelToggleCount');
  if (!panel || !btn || !icon) return;
  const mql = window.matchMedia('(max-width: 768px)');
  function refreshIcon() {
    icon.textContent = panel.classList.contains('collapsed') ? '☰' : '▾';
  }
  function applyDefault() {
    panel.classList.toggle('collapsed', mql.matches);
    refreshIcon();
  }
  applyDefault();
  if (mql.addEventListener) mql.addEventListener('change', applyDefault);
  else if (mql.addListener) mql.addListener(applyDefault);
  btn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    refreshIcon();
  });
  if (total && tc) {
    tc.textContent = total.textContent;
    new MutationObserver(() => { tc.textContent = total.textContent; })
      .observe(total, { childList: true, characterData: true, subtree: true });
  }
})();
</script>
